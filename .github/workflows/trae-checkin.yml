name: Trae CN CheckIn

# GitHub cron 为 UTC；00:30 UTC = 北京时间 08:30
# 08:30 触发后在 job 内随机 sleep 0~30 分钟，实现每天 08:30-09:00 随机签到
# 注意：GitHub 定时触发本身可能有几分钟延迟（偶发更久），且只在默认分支上生效
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅查询签到状态，不领取"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trae-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      # 仅定时触发时随机延迟 0~1800s（08:30-09:00 窗口）；手动触发立即执行
      - name: Random delay (08:30-09:00 CST window)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1800))
          echo "随机延迟 ${DELAY}s 后签到（目标窗口 08:30-09:00 北京时间）"
          sleep "$DELAY"

      - name: Run Trae checkin
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
          TRAE_TOKEN: ${{ secrets.TRAE_TOKEN }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_REGION: ${{ secrets.TRAE_REGION }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python checkin_trae_actions.py $ARGS
