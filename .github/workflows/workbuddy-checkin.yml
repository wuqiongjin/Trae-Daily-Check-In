name: WorkBuddy CheckIn

# GitHub cron 为 UTC；00:30 UTC = 北京时间 08:30
# 08:30 触发后在 job 内随机 sleep 0~30 分钟，实现每天 08:30-09:00 随机签到
# 注意：GitHub 定时触发本身可能有几分钟延迟（偶发更久），且只在默认分支上生效
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅查询签到状态，不领取"
        type: boolean
        default: false

# contents: write 用于把续期后的加密状态 wb_state.json 提交回仓库
permissions:
  contents: write

concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pycryptodome

      # 仅定时触发时随机延迟 0~1800s（08:30-09:00 窗口）；手动触发立即执行
      - name: Random delay (08:30-09:00 CST window)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1800))
          echo "随机延迟 ${DELAY}s 后签到（目标窗口 08:30-09:00 北京时间）"
          sleep "$DELAY"

      - name: Run WorkBuddy checkin
        env:
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
          WORKBUDDY_ENTERPRISE_ID: ${{ secrets.WORKBUDDY_ENTERPRISE_ID }}
          WORKBUDDY_TENANT_ID: ${{ secrets.WORKBUDDY_TENANT_ID }}
          WORKBUDDY_NAME: ${{ secrets.WORKBUDDY_NAME }}
          WB_STATE_KEY: ${{ secrets.WB_STATE_KEY }}
          WB_STATE_FILE: wb_state.json
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python checkin_workbuddy_actions.py $ARGS

      # 续期发生后把最新加密凭证提交回仓库，保证 refreshToken 链条不断
      - name: Commit refreshed credentials state
        if: always()
        run: |
          if [ ! -f wb_state.json ] || [ -z "$(git status --porcelain -- wb_state.json)" ]; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wb_state.json
          git commit -m "chore: refresh WorkBuddy credentials state [skip ci]"
          git push